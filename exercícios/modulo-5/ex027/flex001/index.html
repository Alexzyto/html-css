<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        .container {
            display: flex;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            flex-wrap: wrap;
        }

        .item {
            background-color: lightblue;
            flex: auto;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
            transition: all 0.4s;
            height: 20px;
            box-shadow: 2px 2px 10px rgba(0, 6, 88, 0.438);
        }

        .item:hover {
            align-content: center;
            font-size: 2em;
            height: 200px;
            background-color: darkblue;
            color: white;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="itemA">A</div>
        <div class="item" id="itemB">B</div>
        <div class="item" id="itemC">C</div>
        <div class="item" id="itemD">D</div>
        <div class="item" id="itemE">E</div>
        <div class="item" id="itemF">F</div>
        <div class="item" id="itemG">G</div>
    </div>
</body>
</html>
