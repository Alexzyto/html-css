<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        body {
            display: flex;
            background-image: linear-gradient(45deg, #0F0C74, #1A28FF);
            height: 100vh;
            width: 100%;
        }

        .container {
            height: 200px;
            display: flex;
            margin: auto;
            background-color: aliceblue;
            padding: 10px;
            gap: 10px;
            text-align: center;
            border-radius: 20px;
        }

        .item {
            padding: 30px;
            background-color: #FFEA40;
            flex: auto;
            border: 2px solid #1B0F8B;
            border-radius: 20px;
        }

        #i1 {
            align-self: auto;
        }

        #i2 {
            align-self: flex-start;
        }

        #i3 {
            align-self: flex-end;
        }

        #i4 {
            align-self: center;
        }

        #i5 {
            align-self: stretch;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">auto</div>
        <div class="item" id="i2">flex-start</div>
        <div class="item" id="i3">flex-end</div>
        <div class="item" id="i4">center</div>
        <div class="item" id="i5">stretch</div>
    </div>
</body>
</html>
