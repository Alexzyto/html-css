<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        * {
            padding: 0;
            margin: 0;
        }

        .container {
            display: flex;
            background-color: lightsalmon;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;

        }

        .item {
            background-color: lightblue;
            flex: auto;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de Block A</div>
        <div class="item">Exemplo de Block B</div>
        <div class="item">Exemplo de Block C</div>
        <div class="item">Exemplo de Block D</div>
        <div class="item">Exemplo de Block E</div>
        <div class="item">Exemplo de Block F</div>
        <div class="item">Exemplo de Block G</div>
    </div>
</body>
</html>
