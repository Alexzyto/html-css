<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        * {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            padding: 0px;
            margin: 0px;
        }

        .container {
            display: flex;
            background-image: linear-gradient(45deg, lightsalmon, rgb(255, 123, 0));
            flex-flow: row wrap;
            height: 400px;
            align-items: center;
            justify-content: space-evenly;
            gap: 20px;
            margin: 30px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(54, 36, 19, 0.507);
        }

        .item {
            flex: auto;
            padding: 30px;
            background-image: linear-gradient(45deg, lightblue, rgb(57, 205, 255));
            text-align: center;
            border: 0.5px solid rgba(0, 0, 0, 0.479);
            border-radius: 10px;
            transition: all ease 0.5s;
            box-shadow: 2px 2px 10px rgba(9, 68, 83, 0.507);            
        }

        .item:hover {
            transform: scale(1.1);
            background-image: linear-gradient(rgb(66, 103, 126));
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
        <div class="item">K</div>
        <div class="item">L</div>
        <div class="item">M</div>
    </div>
</body>
</html>
